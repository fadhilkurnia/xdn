name: xdn-forwarder-bench

services:
  bookcatalog-postgres:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: books
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  bookcatalog-app:
    image: michael2718/bookcatalog-nd:5
    environment:
      DB_TYPE: postgres
      DB_HOST: bookcatalog-postgres
    ports:
      - "8000:80"
    depends_on:
      bookcatalog-postgres:
        condition: service_healthy
