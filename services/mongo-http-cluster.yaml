# MongoDB replica set behind the uniform HTTP KV shim, as an XDN
# cluster-mode pod. The frontend (services/mongo-http) discovers the set
# from its local member: writes go to the primary (w:majority) wherever it
# is, reads stay on the nearest (local) member.
#
# Build first:  docker build -t xdn-mongo-cluster:test services/mongo-cluster/
#               docker build -t xdn-mongo-http:test services/mongo-http/
# Launch:       xdn cluster launch mongokv -f services/mongo-http-cluster.yaml
name: mongokv
mode: cluster
peer_port: 27017
num_replicas: 3
state: mongo:/data/db/
components:
  - mongo:
      image: xdn-mongo-cluster:test
      stateful: true
      expose: 27017
  - frontend:
      image: xdn-mongo-http:test
      port: 8080
      entry: true
