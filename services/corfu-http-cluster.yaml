# CorfuDB (client-driven chain replication) behind the uniform HTTP KV
# shim, as an XDN cluster-mode pod. Corfu is the irreducibly client-driven
# case: replication logic lives IN the client library, so the frontend
# (services/corfu-http) embeds the corfu client seeded with the local
# member; writes take a sequencer token and write each log unit in chain
# order, reads query the sequencer and fetch from the chain tail. That
# fan-out is the service's own protocol shape, not shim routing. The
# members self-bootstrap the chain layout from ordinal 0.
#
# Build first:  docker build -t xdn-corfu-cluster:test services/corfu-cluster/
#               docker build -t xdn-corfu-http:test services/corfu-http/
# Launch:       xdn cluster launch corfukv -f services/corfu-http-cluster.yaml
mode: cluster
peer_port: 9000
num_replicas: 3
state: corfu:/config/         # unused in memory mode, required by the spec
components:
  - corfu:
      image: xdn-corfu-cluster:test
      stateful: true
      expose: 9000
  - frontend:
      image: xdn-corfu-http:test
      port: 8080
      entry: true
